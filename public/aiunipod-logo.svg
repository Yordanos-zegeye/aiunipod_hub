<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Symbol: UNIPOD Neural Hexagon -->
  <g transform="translate(10, 10)">
    <polygon points="30,4 56,19 56,49 30,64 4,49 4,19" fill="#0B132B" stroke="#0284C7" stroke-width="2.5"/>
    <circle cx="30" cy="18" r="5" fill="url(#primaryGrad)"/>
    <circle cx="16" cy="42" r="4.5" fill="url(#primaryGrad)"/>
    <circle cx="44" cy="42" r="4.5" fill="url(#primaryGrad)"/>
    <circle cx="30" cy="34" r="5.5" fill="url(#accentGrad)" filter="url(#glow)"/>
    <line x1="30" y1="18" x2="16" y2="42" stroke="#38BDF8" stroke-width="2"/>
    <line x1="30" y1="18" x2="44" y2="42" stroke="#38BDF8" stroke-width="2"/>
    <line x1="16" y1="42" x2="44" y2="42" stroke="#38BDF8" stroke-width="2"/>
    <line x1="30" y1="18" x2="30" y2="34" stroke="#FBBF24" stroke-width="1.8"/>
    <line x1="16" y1="42" x2="30" y2="34" stroke="#FBBF24" stroke-width="1.8"/>
    <line x1="44" y1="42" x2="30" y2="34" stroke="#FBBF24" stroke-width="1.8"/>
  </g>

  <!-- Typography -->
  <text x="82" y="38" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5" fill="#0F172A">
    AI UNIPOD
  </text>
  <text x="84" y="55" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="2.5" fill="#0284C7">
    ETHIOPIA
  </text>
  <text x="146" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" letter-spacing="0.5" fill="#64748B">
    • powered by timbuktoo
  </text>
</svg>
